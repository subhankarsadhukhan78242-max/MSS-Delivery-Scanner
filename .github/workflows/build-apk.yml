name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o MSSDeliveryScanner-Android-Source.zip -d extracted

      - name: Build APK
        working-directory: extracted/MSSDeliveryScanner
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSS-Delivery-Scanner-APK
          path: extracted/MSSDeliveryScanner/app/build/outputs/apk/debug/app-debug.apk
