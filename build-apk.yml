name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q MSSDeliveryScanner-Android-Source-FIXED.zip -d extracted
          test -f extracted/MSSDeliveryScanner/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/MSSDeliveryScanner
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSS-Delivery-Scanner-APK
          path: extracted/MSSDeliveryScanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
